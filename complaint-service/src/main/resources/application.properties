spring.application.name=complaint-service
server.port=8086
eureka.client.enabled=false

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/home_energy_tracker
spring.datasource.username=postgres
spring.datasource.password=postgres123

# HikariCP Connection Pool - Reduce TTFB
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=ComplaintHikariPool

# AWS S3
aws.access-key=${AWS_ACCESS_KEY_ID:your-aws-access-key-here}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:your-aws-secret-key-here}
aws.region=ap-south-1
aws.s3.bucket-name=home-energy-tracker-complaints

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
