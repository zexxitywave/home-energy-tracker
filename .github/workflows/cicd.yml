name: CI — Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build all services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build user-service
        run: cd user-service && ./mvnw -q package -DskipTests

      - name: Build device-service
        run: cd device-service && ./mvnw -q package -DskipTests

      - name: Build ingestion-service
        run: cd ingestion-service && ./mvnw -q package -DskipTests

      - name: Build usage-service
        run: cd usage-service && ./mvnw -q package -DskipTests

      - name: Build alert-service
        run: cd alert-service && ./mvnw -q package -DskipTests

      - name: Build complaint-service
        run: cd complaint-service && ./mvnw -q package -DskipTests

      - name: Build api-gateway
        run: cd api-gateway && ./mvnw -q package -DskipTests

      - name: Build insight-service
        run: cd insight-service && ./mvnw -q package -DskipTests
